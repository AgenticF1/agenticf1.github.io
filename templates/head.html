<!-- ===========================================================================
  Shared <head> reference. GitHub Pages has no build step / includes, so this
  markup is copied into each page. Adjust the asset path prefix per location:
    site root (index.html, about.html) : href="assets/..."
    /blog/*.html                       : href="../assets/..."
  Keep the pre-paint theme script FIRST and inline — it prevents a flash.
  analytics.js carries the GA4 gtag setup (tracking ID G-LG0X3X6YDH) — one
  script tag here loads it, so the tag lives in exactly one place to update.
  =========================================================================== -->

    var m = localStorage.getItem("theme");
    if (m === "light" || m === "dark") document.documentElement.setAttribute("data-theme", m);
  } catch (e) {}
</script>
